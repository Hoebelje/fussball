<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      touch-action: pan-y;
      width: 100%;
      overflow: hidden; /* Fenster selbst nicht scrollbar */
      overflow-x: hidden;
    }
    /* Kopfzeile des Widgets ("FUSSBALL.DE" + "Letzte/Nächste Spiele - ...") ausblenden.
       Der Titel bricht je nach Breite in 1-3 Zeilen um, daher drei Stufen. */
    .fussballde_widget {
      touch-action: pan-y;
      margin-top: -92px;   /* breit: Titel einzeilig */
      width: 100%;
    }
    @media (max-width: 640px) {
      .fussballde_widget { margin-top: -138px; }  /* Titel zweizeilig */
    }
    @media (max-width: 440px) {
      .fussballde_widget { margin-top: -166px; }  /* Titel dreizeilig (Handy) */
    }
  </style>
  <script 
    type="text/javascript" 
    src="https://www.fussball.de/widgets.js">
  </script>
</head>
<body>
  <div 
    class="fussballde_widget"
    data-id="3b627558-1c9a-4469-83bb-bcf7b9fb50fb"
    data-type="club-matches"
    style="width: 100%"
  ></div>
</body>
</html>
