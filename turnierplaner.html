.rb{width:calc(44px*var(--fs));height:calc(44px*var(--fs));border-radius:50%;border:2px solid var(--ac);color:var(--at);background:var(--sf)}.rb[data-a="askstop"]{border:2px solid var(--bd);color:var(--tx)}
.mid{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;width:calc(56px*var(--fs));height:calc(92px*var(--fs))}.mid .mt{font-size:calc(11px*var(--fs))}
.sc{background:var(--gr);border-radius:8px;min-width:40px;text-align:center;font-size:calc(22px*var(--fs));font-weight:700;padding:4px 6px}
.lk{background:none;border:0;color:var(--at);padding:6px 0;font-size:calc(13px*var(--fs));min-height:calc(44px*var(--fs));min-width:calc(44px*var(--fs))}.lk:disabled{opacity:.4}.g3{display:grid;grid-template-columns:minmax(0,1fr) calc(92px*var(--fs)) minmax(0,1fr);gap:8px;align-items:center}.g3>.r{text-align:right}.mm{display:flex;justify-content:center;gap:6px}.opt{display:flex;align-items:center;gap:12px;min-height:calc(48px*var(--fs))}.opt input{width:calc(24px*var(--fs));height:calc(24px*var(--fs));margin:0;flex:none;accent-color:var(--ac)}.opt.mu{color:var(--mu)}.ok{color:#1a8f5f}.c.op{position:relative}button.rb.pc{position:absolute;left:calc(50% - 21px*var(--fs));top:calc(50% - 21px*var(--fs));width:calc(42px*var(--fs));height:calc(42px*var(--fs));font-size:calc(15px*var(--fs))}button.rb{width:calc(36px*var(--fs));height:calc(36px*var(--fs));position:relative;font-size:calc(13px*var(--fs))}button.rb::after{content:"";position:absolute;inset:-4px}.ctl .btns{gap:12px}.dot.st{opacity:.35}.tr{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;height:calc(48px*var(--fs));padding:0 16px;margin-bottom:8px;border:0;border-radius:12px;background:var(--ac);color:var(--on);font-size:calc(14px*var(--fs));text-align:left}.tr .nm{flex:1;min-width:0}.tr b{font-size:calc(30px*var(--fs));line-height:1}.tr:disabled{opacity:.55}.tr:not(:disabled):hover{filter:brightness(.88)}.tr:not(:disabled):active{filter:brightness(.78)}.c.ed .tr{background:var(--gr);color:var(--tx)}.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;font-size:calc(12px*var(--fs));color:var(--mu)}.ctl .btns{display:flex;gap:8px}.ctl .lk{justify-self:end;padding:2px 0;min-height:44px}.c.ed .tp{background:var(--gr);color:var(--tx)}.c.ed .rb{border-color:var(--bd);color:var(--tx)}.c>.row.mt:first-child{min-height:44px}.c:has(>.row.mt:first-child){padding-top:0}.c.fb:has(>.row.mt:first-child){padding-top:1px}.sp{display:inline-block;border-radius:99px;padding:2px 10px;font-size:calc(12px*var(--fs));font-weight:500;line-height:1.4;white-space:nowrap;font-variant-numeric:tabular-nums}.sp.ok-p{background:rgba(26,143,95,.14);color:#1a8f5f}.sp.neg{background:rgba(196,38,38,.12);color:var(--rd)}.sp.du{background:var(--gr);color:var(--mu)}.lk[data-a="reopen"],.lk[data-a="undo"],.lk[data-a="edit"]{font-size:calc(12px*var(--fs))}@media(prefers-color-scheme:dark){.sp.ok-p{background:rgba(76,195,138,.16);color:#4cc38a}.sp.neg{background:rgba(255,122,122,.16)}}.c.fb{border:1px solid var(--ln);border-left:4px solid #1a8f5f;padding:0 12px 10px}.sx{font-size:calc(16px*var(--fs))}@media(prefers-color-scheme:dark){.ok{color:#4cc38a}.c.fb{border-left-color:#4cc38a}}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sh{min-height:calc(76px*var(--fs));border:1px solid var(--bd);border-radius:14px;background:var(--sf);font-size:calc(12px*var(--fs));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.sh span{font-size:calc(22px*var(--fs))}.shine{background:linear-gradient(90deg,var(--rd) 38%,rgba(255,255,255,.95) 50%,var(--rd) 62%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sh 3s linear infinite}@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}@media(prefers-reduced-motion:reduce){.shine{animation:none;background:none;-webkit-text-fill-color:currentColor}}#pr{display:none}@media print{#app>*{display:none!important}#app>#pr{display:block!important}#app{height:auto;border:0}body{background:#fff;color:#000}h3{text-align:left}}
